services:
  transcribe:
    build: .
    image: morley-transcribe:latest
    gpus: all
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPLY_MODEL=${WHISPLY_MODEL:-large-v3-turbo}
    volumes:
      - ../in:/in            # drop audio here (host: Transcribe\in)
      - ../out:/out          # results land here (host: Transcribe\out)
      - ../archive:/archive  # processed sources moved here (host: Transcribe\archive)
      - hf-cache:/root/.cache/huggingface   # models persist between runs

volumes:
  hf-cache:
